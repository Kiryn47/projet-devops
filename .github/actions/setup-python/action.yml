name: Setup Python
description: Installe Python et les dépendances avec cache pip
inputs:
  python-version:
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: application/config/requirements*.txt
    - run: pip install -r application/config/requirements.txt -r application/config/requirements-dev.txt
      shell: bash
